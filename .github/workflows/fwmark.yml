name: Linux fwmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".cross_compile.sh"
      - ".github/ci-paths.json"
      - ".github/workflows/fwmark.yml"
      - "assets/windivert/**"
      - "cmd/cmd*.go"
      - "cmd/doctor*.go"
      - "cmd/flavor*.go"
      - "cmd/fwmark*.go"
      - "cmd/mtr_json*.go"
      - "cmd/mtr_json_run*.go"
      - "cmd/mtr_mode*.go"
      - "cmd/tos*.go"
      - "cmd/trace_mode*.go"
      - "config/**/*.go"
      - "config/**/testdata/**"
      - "default.pgo"
      - "dn42/**/*.go"
      - "dn42/**/testdata/**"
      - "go.mod"
      - "go.sum"
      - "internal/mtrsession/**/*.go"
      - "internal/mtrsession/**/testdata/**"
      - "internal/routeprobe/**/*.go"
      - "internal/routeprobe/**/testdata/**"
      - "ipgeo/**/*.go"
      - "ipgeo/**/testdata/**"
      - "main.go"
      - "pow/**/*.go"
      - "pow/**/testdata/**"
      - "printer/mtr_raw*.go"
      - "scripts/ci/**"
      - "scripts/regression/fwmark*"
      - "trace/**/*.go"
      - "trace/**/testdata/**"
      - "util/**/*.go"
      - "util/**/testdata/**"
      - "wshandle/**/*.go"
      - "wshandle/**/testdata/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".cross_compile.sh"
      - ".github/ci-paths.json"
      - ".github/workflows/fwmark.yml"
      - "assets/windivert/**"
      - "cmd/cmd*.go"
      - "cmd/doctor*.go"
      - "cmd/flavor*.go"
      - "cmd/fwmark*.go"
      - "cmd/mtr_json*.go"
      - "cmd/mtr_json_run*.go"
      - "cmd/mtr_mode*.go"
      - "cmd/tos*.go"
      - "cmd/trace_mode*.go"
      - "config/**/*.go"
      - "config/**/testdata/**"
      - "default.pgo"
      - "dn42/**/*.go"
      - "dn42/**/testdata/**"
      - "go.mod"
      - "go.sum"
      - "internal/mtrsession/**/*.go"
      - "internal/mtrsession/**/testdata/**"
      - "internal/routeprobe/**/*.go"
      - "internal/routeprobe/**/testdata/**"
      - "ipgeo/**/*.go"
      - "ipgeo/**/testdata/**"
      - "main.go"
      - "pow/**/*.go"
      - "pow/**/testdata/**"
      - "printer/mtr_raw*.go"
      - "scripts/ci/**"
      - "scripts/regression/fwmark*"
      - "trace/**/*.go"
      - "trace/**/testdata/**"
      - "util/**/*.go"
      - "util/**/testdata/**"
      - "wshandle/**/*.go"
      - "wshandle/**/testdata/**"

permissions:
  contents: read
concurrency:
  group: fwmark-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dual-egress:
    name: Dual-stack policy routing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: Install fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y iproute2 tcpdump
      - name: Build
        run: |
          go build -o "$RUNNER_TEMP/nexttrace-fwmark" .
          go test -c -o "$RUNNER_TEMP/fwmark-socket.test" ./trace/internal
          go test -c -o "$RUNNER_TEMP/fwmark-trace.test" ./trace
      - name: Route reply and socketcall regressions
        run: |
          go test ./internal/routeprobe
          GOARCH=386 CGO_ENABLED=0 go test ./internal/routeprobe
          GOARCH=s390x CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/routeprobe-s390x.test" ./internal/routeprobe
      - name: Native sockets and MTR rotation
        run: |
          sudo env NEXTTRACE_FWMARK_INTEGRATION=1 "$RUNNER_TEMP/fwmark-socket.test" -test.run '^TestFWMarkNativeSockets$' -test.v
          sudo env NEXTTRACE_FWMARK_INTEGRATION=1 "$RUNNER_TEMP/fwmark-trace.test" -test.run '^TestFWMarkMTRRotation$' -test.v
      - name: Mark capability failures
        run: sudo env NEXTTRACE_FWMARK_NO_CAPS=1 setpriv --bounding-set=-net_admin,-net_raw --inh-caps=-all --ambient-caps=-all "$RUNNER_TEMP/fwmark-socket.test" -test.run '^TestFWMarkPermissionDenied$' -test.v
      - name: IPv4 and IPv6 dual egress
        run: sudo bash scripts/regression/fwmark_linux.sh "$RUNNER_TEMP/nexttrace-fwmark" "$RUNNER_TEMP/fwmark-results"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fwmark-results
          path: ${{ runner.temp }}/fwmark-results
          if-no-files-found: warn
