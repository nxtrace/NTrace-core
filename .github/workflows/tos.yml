name: TOS packet acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".cross_compile.sh"
      - ".github/ci-paths.json"
      - ".github/workflows/tos.yml"
      - "assets/windivert/**"
      - "cmd/cmd*.go"
      - "cmd/doctor*.go"
      - "cmd/flavor*.go"
      - "cmd/fwmark*.go"
      - "cmd/mtr_json*.go"
      - "cmd/mtr_json_run*.go"
      - "cmd/mtr_mode*.go"
      - "cmd/tos*.go"
      - "cmd/trace_mode*.go"
      - "config/**/*.go"
      - "config/**/testdata/**"
      - "default.pgo"
      - "dn42/**/*.go"
      - "dn42/**/testdata/**"
      - "go.mod"
      - "go.sum"
      - "internal/mtrsession/**/*.go"
      - "internal/mtrsession/**/testdata/**"
      - "internal/routeprobe/**/*.go"
      - "internal/routeprobe/**/testdata/**"
      - "ipgeo/**/*.go"
      - "ipgeo/**/testdata/**"
      - "main.go"
      - "pow/**/*.go"
      - "pow/**/testdata/**"
      - "printer/mtr_raw*.go"
      - "scripts/ci/**"
      - "scripts/regression/test_tos*"
      - "scripts/regression/tos*"
      - "trace/**/*.go"
      - "trace/**/testdata/**"
      - "util/**/*.go"
      - "util/**/testdata/**"
      - "wshandle/**/*.go"
      - "wshandle/**/testdata/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".cross_compile.sh"
      - ".github/ci-paths.json"
      - ".github/workflows/tos.yml"
      - "assets/windivert/**"
      - "cmd/cmd*.go"
      - "cmd/doctor*.go"
      - "cmd/flavor*.go"
      - "cmd/fwmark*.go"
      - "cmd/mtr_json*.go"
      - "cmd/mtr_json_run*.go"
      - "cmd/mtr_mode*.go"
      - "cmd/tos*.go"
      - "cmd/trace_mode*.go"
      - "config/**/*.go"
      - "config/**/testdata/**"
      - "default.pgo"
      - "dn42/**/*.go"
      - "dn42/**/testdata/**"
      - "go.mod"
      - "go.sum"
      - "internal/mtrsession/**/*.go"
      - "internal/mtrsession/**/testdata/**"
      - "internal/routeprobe/**/*.go"
      - "internal/routeprobe/**/testdata/**"
      - "ipgeo/**/*.go"
      - "ipgeo/**/testdata/**"
      - "main.go"
      - "pow/**/*.go"
      - "pow/**/testdata/**"
      - "printer/mtr_raw*.go"
      - "scripts/ci/**"
      - "scripts/regression/test_tos*"
      - "scripts/regression/tos*"
      - "trace/**/*.go"
      - "trace/**/testdata/**"
      - "util/**/*.go"
      - "util/**/testdata/**"
      - "wshandle/**/*.go"
      - "wshandle/**/testdata/**"

permissions:
  contents: read
concurrency:
  group: tos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unix:
    name: ${{ matrix.name }} full-byte dual-stack capture
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Install Linux fixture dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tcpdump iproute2
      - name: Build
        id: build
        run: |
          go build -o "$RUNNER_TEMP/nexttrace-tos" .
          go test -c -o "$RUNNER_TEMP/tos-trace.test" ./trace
          go test -c -o "$RUNNER_TEMP/tos-socket.test" ./trace/internal
      - name: Validate Linux raw socket source queries
        if: runner.os == 'Linux'
        run: |
          go test -c -o "$RUNNER_TEMP/tos-route.test" ./internal/routeprobe
          sudo env NEXTTRACE_TOS_ROUTE_INTEGRATION=1 "$RUNNER_TEMP/tos-route.test" -test.run '^TestRawSourceSocketIntegration$' -test.v
      - name: Reusing sockets restores TOS to zero
        run: sudo env NEXTTRACE_TOS_SOCKET_INTEGRATION=1 "$RUNNER_TEMP/tos-socket.test" -test.run '^TestTOSSocketReuse$' -test.v
      - name: MTR configuration failure is terminal
        run: sudo env NEXTTRACE_TOS_INTEGRATION=1 "$RUNNER_TEMP/tos-trace.test" -test.run '^(TestMTRTOSConfigurationFailureIsTerminal|TestTraceSendTOSConfigurationFailureIsTerminal)$' -test.v
      - name: Validate packet assertions
        run: python3 -m unittest discover -s scripts/regression -p 'test_tos_capture.py' -v
      - name: Capture IPv4 and IPv6 traceroute and MTR
        run: sudo python3 scripts/regression/tos_capture.py run "$RUNNER_TEMP/nexttrace-tos" "$RUNNER_TEMP/tos-results/packets"
      - name: Capture TOS across MTR engine rebuilds
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sudo python3 scripts/regression/tos_capture.py rebuild "$RUNNER_TEMP/tos-trace.test" "$RUNNER_TEMP/tos-results/rebuild"
      - name: Verify Linux policy routes and UDP fragments
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        run: sudo bash scripts/regression/tos_linux.sh "$RUNNER_TEMP/nexttrace-tos" "$RUNNER_TEMP/tos-results/routes"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tos-${{ matrix.name }}
          path: ${{ runner.temp }}/tos-results
          if-no-files-found: error
  windows:
    name: Windows amd64 full-byte dual-stack capture
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Build and prepare the existing WinDivert backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'tos-bin'
          New-Item -ItemType Directory -Force $dir | Out-Null
          go build -o "$dir\nexttrace.exe" .
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          go test -c -o "$dir\internal.test.exe" ./trace/internal
          if ($LASTEXITCODE -ne 0) { throw 'test build failed' }
          go test -c -o "$dir\trace.test.exe" ./trace
          if ($LASTEXITCODE -ne 0) { throw 'trace test build failed' }
          & "$dir\nexttrace.exe" --init
          if ($LASTEXITCODE -ne 0) { throw 'WinDivert setup failed' }
      - name: Independently capture IPv4 and IPv6 traceroute and MTR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:NEXTTRACE_TOS_PACKET_INTEGRATION = '1'
          $env:NEXTTRACE_TOS_BINARY = Join-Path $env:RUNNER_TEMP 'tos-bin\nexttrace.exe'
          $env:NEXTTRACE_TOS_REBUILD_BINARY = Join-Path $env:RUNNER_TEMP 'tos-bin\trace.test.exe'
          $env:NEXTTRACE_TOS_ARTIFACTS = Join-Path $env:RUNNER_TEMP 'tos-results'
          New-Item -ItemType Directory -Force $env:NEXTTRACE_TOS_ARTIFACTS | Out-Null
          git rev-parse HEAD | Out-File "$env:NEXTTRACE_TOS_ARTIFACTS\revision.txt"
          [Environment]::OSVersion.VersionString | Out-File "$env:NEXTTRACE_TOS_ARTIFACTS\environment.txt"
          & "$env:RUNNER_TEMP\tos-bin\internal.test.exe" '-test.run=^TestTOSWindows(NativeICMPv4|PacketCapture|MTRRebuildCapture)$' '-test.v' '-test.timeout=15m' 2>&1 | Tee-Object "$env:NEXTTRACE_TOS_ARTIFACTS\tests.txt"
          if ($LASTEXITCODE -ne 0) { throw 'TOS capture acceptance failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tos-Windows-amd64
          path: ${{ runner.temp }}/tos-results
          if-no-files-found: error
