name: golangci-lint

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "**/testdata/**"
      - ".cross_compile.sh"
      - ".github/ci-paths.json"
      - ".github/workflows/golangci-lint.yml"
      - ".golangci.yml"
      - "default.pgo"
      - "go.mod"
      - "go.sum"
      - "scripts/ci/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "**/testdata/**"
      - ".cross_compile.sh"
      - ".github/ci-paths.json"
      - ".github/workflows/golangci-lint.yml"
      - ".golangci.yml"
      - "default.pgo"
      - "go.mod"
      - "go.sum"
      - "scripts/ci/**"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.3
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go (built-in cache)
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          check-latest: true
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-mode: goinstall
          # Large PRs exceed GitHub's diff API limit; compare the local Git history instead.
          only-new-issues: ${{ github.event_name != 'pull_request' }}
          args: ${{ github.event_name == 'pull_request' && format('--new-from-merge-base={0}', github.event.pull_request.base.sha) || '' }}
